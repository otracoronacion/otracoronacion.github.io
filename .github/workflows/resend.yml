name: Reenviar coronación

on:
  workflow_dispatch:
    inputs:
      event_ids:
        description: "id(s) de data/podios.json, separados por coma"
        required: true
      tuitear:
        description: "1 = además postear en X"
        required: false
        default: ""
      dry_run:
        description: "1 = email como borrador (y sin tweet)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Armar new_events.json desde podios.json
        run: |
          python3 - <<'EOF'
          import json
          ids = [x.strip() for x in "${{ github.event.inputs.event_ids }}".split(",") if x.strip()]
          podios = json.load(open('data/podios.json', encoding='utf-8'))
          por_id = {e['id']: e for e in podios}
          faltan = [i for i in ids if i not in por_id]
          assert not faltan, f"no encontré estos ids en podios.json: {faltan}"
          evs = [por_id[i] for i in ids]
          json.dump(evs, open('new_events.json', 'w'), ensure_ascii=False, indent=2)
          print(f"Reenviando {len(evs)} evento(s):")
          for e in evs:
              print(f"  [{e['medal']}/{e.get('scope','mundial')}] {e['title'][:70]}")
          EOF

      - name: Enviar email
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python3 scraper/send_email.py

      - name: Postear en X
        if: github.event.inputs.tuitear == '1' && github.event.inputs.dry_run != '1'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python3 scraper/post_x.py
