name: Coronación diaria

on:
  schedule:
    - cron: "33 10 * * *"   # 07:33 ART: GitHub demora ~43 min, así aterriza ~08:16 — la épica de 1816 🇦🇷
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = crear email como borrador en vez de enviar"
        required: false
        default: ""

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rastrear podios
        run: python3 scraper/scrape.py

      - name: Verificar con IA (Haiku)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scraper/verify_llm.py

      - name: ¿Hay eventos nuevos?
        id: check
        run: |
          if [ -f new_events.json ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "Eventos nuevos encontrados:"
            cat new_events.json
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Sin coronaciones hoy. Silencio."
          fi

      - name: Commitear datos actualizados
        run: |
          git config user.name "coronacion-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "🏅 Actualización diaria de podios"
          git push

      - name: Enviar email a suscriptores
        if: steps.check.outputs.new == 'true'
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ -f llm_failed ]; then
            echo "⚠️ El verificador IA tuvo fallas: el email queda como BORRADOR para revisión."
            export DRY_RUN=1
          fi
          python3 scraper/send_email.py

      - name: Postear en X
        if: steps.check.outputs.new == 'true' && github.event.inputs.dry_run != '1'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          if [ -f llm_failed ]; then echo "⚠️ Verificador IA con fallas: no tuiteo."; exit 0; fi
          if [ -z "$X_API_KEY" ]; then echo "Secrets de X no configurados todavía; salteo."; exit 0; fi
          python3 scraper/post_x.py

      - name: Preservar diagnóstico si falló el envío
        if: failure()
        run: |
          git config user.name "coronacion-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/last_email_error.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "⚠️ Error de envío preservado en data/last_email_error.json"; git push; }
