name: Coronación diaria

# Siete disparos escalonados en vez de uno.
#
# El cron único de las 10:33 UTC funcionó hasta el 26/08: GitHub demoraba entre
# 18 y 48 minutos y el mail aterrizaba 07:51–08:21 ART. Desde el 27/08 la cola
# de Actions se degradó a 3–11 horas y el mail empezó a caer 10:30–18:13 ART:
# "despertate coronado" llegando a la hora de almorzar.
#
# Como no podemos controlar la demora, tiramos varias líneas al agua a lo largo
# de la noche y la madrugada. `turno.sh` deja trabajar SOLO a la primera que
# aterriza a partir de las 07 ART; las demás salen en 10 segundos sin scrapear
# ni gastar un peso de IA. Sea la demora de 10 minutos o de 12 horas, alguna cae
# entre las 07 y las 10 de la mañana — y el cron de las 12:19 UTC (09:19 ART)
# garantiza que ningún día quede sin publicar.
on:
  schedule:
    - cron: "7 1 * * *"     # 22:07 ART (día anterior) — la red para demoras de ~10 h
    - cron: "19 3 * * *"    # 00:19 ART — demoras de ~7 h
    - cron: "41 5 * * *"    # 02:41 ART — demoras de ~5 h
    - cron: "13 7 * * *"    # 04:13 ART — demoras de ~3 h (la mediana de hoy)
    - cron: "47 8 * * *"    # 05:47 ART — demoras de ~1,5 h
    - cron: "33 10 * * *"   # 07:33 ART — el de siempre: si GitHub se normaliza, gana este
    - cron: "19 12 * * *"   # 09:19 ART — último recurso: aterrice cuando aterrice, publica
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = crear email como borrador en vez de enviar"
        required: false
        default: ""

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Guardia barato: decide si esta corrida trabaja. Checkout liviano y chau.
  turno:
    runs-on: ubuntu-latest
    outputs:
      correr: ${{ steps.decidir.outputs.correr }}
    steps:
      - uses: actions/checkout@v5

      - name: ¿Le toca a esta corrida?
        id: decidir
        run: |
          salida=$(bash scraper/turno.sh "${{ github.event_name }}")
          echo "$salida"
          echo "$salida" | tail -1 >> "$GITHUB_OUTPUT"

  scrape-and-send:
    needs: turno
    if: needs.turno.outputs.correr == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Anotar el aterrizaje
        run: bash scraper/marcar_corrida.sh "${{ github.event.schedule }}" "${{ github.event_name }}"

      - name: Rastrear podios
        run: python3 scraper/scrape.py

      - name: Verificar con IA (Haiku)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scraper/verify_llm.py

      - name: ¿Hay eventos nuevos?
        id: check
        run: |
          if [ -f new_events.json ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "Eventos nuevos encontrados:"
            cat new_events.json
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Sin coronaciones hoy. Silencio."
          fi

      - name: Commitear datos actualizados
        run: |
          git config user.name "coronacion-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "🏅 Actualización diaria de podios"
          # Rebase antes de empujar: si alguien pushea mientras el loop corre, el
          # push se rechaza y el día queda sin publicar EN SILENCIO. Pasó el 15/09.
          ok=0
          for intento in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
            echo "push rechazado (intento $intento), reintento…"
            sleep 5
          done
          # Si no pudimos pushear, el marcador del día NO quedó guardado. Cortamos
          # acá a propósito: sin mail, sin tweet y con el día abierto, para que el
          # próximo cron reintente entero en vez de dar el día por hecho.
          if [ "$ok" != "1" ]; then
            echo "::error::No se pudo pushear después de 3 intentos. El próximo cron reintenta el día."
            exit 1
          fi

      - name: Enviar email a suscriptores
        if: steps.check.outputs.new == 'true'
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ -f llm_failed ]; then
            echo "⚠️ El verificador IA tuvo fallas: el email queda como BORRADOR para revisión."
            export DRY_RUN=1
          fi
          python3 scraper/send_email.py

      - name: Postear en X
        if: steps.check.outputs.new == 'true' && github.event.inputs.dry_run != '1'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          if [ -f llm_failed ]; then echo "⚠️ Verificador IA con fallas: no tuiteo."; exit 0; fi
          if [ -z "$X_API_KEY" ]; then echo "Secrets de X no configurados todavía; salteo."; exit 0; fi
          python3 scraper/post_x.py

      - name: Preservar diagnóstico si falló el envío
        if: failure()
        run: |
          git config user.name "coronacion-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/last_email_error.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "⚠️ Error de envío preservado en data/last_email_error.json"; git push; }
