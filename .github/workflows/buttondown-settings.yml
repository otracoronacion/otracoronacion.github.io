name: Identidad del newsletter

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "aplicar | dry-run (solo mirar) | dump (volcar todos los campos)"
        required: false
        default: "aplicar"
        type: choice
        options: [aplicar, dry-run, dump]

permissions:
  contents: write

jobs:
  settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sincronizar identidad pública en Buttondown
        id: sync
        continue-on-error: true
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          case "${{ github.event.inputs.modo }}" in
            dry-run) python3 scraper/buttondown_settings.py --dry-run ;;
            dump)    python3 scraper/buttondown_settings.py --dump ;;
            *)       python3 scraper/buttondown_settings.py ;;
          esac

      - name: Publicar el antes/después en una branch
        run: |
          git config user.name "coronacion-bot"
          git config user.email "actions@users.noreply.github.com"
          git switch --orphan buttondown-settings
          git add -f buttondown_settings.json 2>/dev/null || { echo '{"error":"sin resultados"}' > buttondown_settings.json; git add -f buttondown_settings.json; }
          git commit -m "Identidad del newsletter: valores previos y aplicados"
          git push -f origin buttondown-settings

      - name: Reflejar el resultado del paso de sincronización
        if: steps.sync.outcome == 'failure'
        run: exit 1
